# Conexão do dbt. Nenhuma senha aqui: tudo vem de variáveis de ambiente, que o Makefile
# carrega do .env. Rode sempre pelo make (make dbt, make dbt-seed) ou com --profiles-dir dbt.
flowstream:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', '127.0.0.1') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('APP_DB_USER') }}"
      password: "{{ env_var('APP_DB_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'flowstream') }}"
      schema: prata
      threads: 2
      connect_timeout: 10
